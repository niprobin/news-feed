<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Actualités</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Actualités</h1>
    <div class="controls">
      <div class="segmented" role="group" aria-label="Période" id="range">
        <button data-range="7days">7 derniers jours</button>
        <button data-range="month">Ce mois-ci</button>
        <button data-range="3months">3 derniers mois</button>
      </div>
      <select id="source" class="select" aria-label="Source">
        <option value="">Toutes les sources</option>
      </select>
      <div class="segmented" role="group" aria-label="Affichage" id="view">
        <button data-view="grid">Grille</button>
        <button data-view="list">Liste</button>
      </div>
      <button id="refresh" class="icon-btn" title="Actualiser" aria-label="Actualiser">↻</button>
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status"></p>
    <div id="content"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
